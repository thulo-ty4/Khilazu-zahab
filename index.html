<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="مكتبة خلاص الذهب للشيخ الحاج مالك سي - قراءة فصول الكتاب بسهولة مع الوضع الليلي">
    <title>خلاص الذهب - El Hadji Malick Sy</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Noto+Sans+Arabic:wght@400;700&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- CSS Centralisé -->
    <link rel="stylesheet" href="style.css">

    <!-- Script Google AdSense -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4368298895659451" crossorigin="anonymous"></script>
</head>
<body>

<div class="container">
    <header>
        <button class="theme-toggle" id="themeToggle" title="تبديل الوضع الليلي">
            <i class="fas fa-moon"></i>
        </button>

        <!-- AdSense en haut -->
        <ins class="adsbygoogle"
             style="display:block; margin-bottom:20px;"
             data-ad-client="ca-pub-4368298895659451"
             data-ad-slot="6482904758"
             data-ad-format="auto"
             data-full-width-responsive="true"></ins>
        <script>
             (adsbygoogle = window.adsbygoogle || []).push({});
        </script>

        <h1>خلاص الذهب</h1>
        <p class="subtitle">الشيخ الحاج مالك سي</p>
    </header>

    <div class="content-card">
        <div class="intro">
            <p>مرحباً بكم في مكتبة "خلاص الذهب" للشيخ الحاج مالك سي. هنا يمكنكم الوصول إلى جميع فصول الكتاب بسهولة ويسر.</p>
        </div>

        <div class="search-box">
            <i class="fas fa-search"></i>
            <input type="text" id="searchInput" placeholder="ابحث عن فصل معين...">
        </div>

        <div id="chaptersGrid" class="chapters-grid">
            <!-- Les chapitres seront insérés ici par JavaScript -->
        </div>
    </div>

    <!-- AdSense en bas -->
    <ins class="adsbygoogle"
         style="display:block; margin-top:20px;"
         data-ad-client="ca-pub-4368298895659451"
         data-ad-slot="6482904758"
         data-ad-format="auto"
         data-full-width-responsive="true"></ins>
    <script>
         (adsbygoogle = window.adsbygoogle || []).push({});
        </script>

    <footer>
        <p>جميع الحقوق محفوظة © 2023 | خلاص الذهب - El Hadji Malick Sy</p>
    </footer>
</div>

<script src="script.js"></script>
<script>
// Chapters Logic
document.addEventListener('DOMContentLoaded', function() {
    const chaptersContainer = document.getElementById('chaptersGrid');
    const searchInput = document.getElementById('searchInput');
    let chapters = [];

    for (let i = 1; i <= 29; i++) {
        chapters.push({
            number: i,
            title: `الفصل ${i.toString().padStart(2, '0')}`,
            link: `chapter${i.toString().padStart(2, '0')}.html`
        });
    }

    function displayChapters(chaptersArray) {
        chaptersContainer.innerHTML = '';
        chaptersArray.forEach(c => {
            const div = document.createElement('div');
            div.className = 'chapter-card';
            div.innerHTML = `
                <a href="${c.link}">
                    <span class="chapter-number">${c.number}</span>
                    <span class="chapter-title-text">${c.title}</span>
                </a>
            `;
            chaptersContainer.appendChild(div);
        });
    }

    searchInput.addEventListener('input', function() {
        const term = this.value.trim().toLowerCase();
        if (!term) { displayChapters(chapters); return; }
        const filtered = chapters.filter(c =>
            c.title.toLowerCase().includes(term) || c.number.toString().includes(term)
        );
        displayChapters(filtered);
    });

    displayChapters(chapters);
});
</script>

</body>
</html>
